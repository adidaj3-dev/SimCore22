<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SimCore22</title>
  <meta name="description" content="Enter your round hole by hole, follow your league live and track your indoor handicap.">
  <meta name="theme-color" content="#070C17">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/admin.css">
  <link rel="stylesheet" href="/static/css/auth.css">
  <link rel="stylesheet" href="/static/css/player.css">
  <script>
    /* apply the saved theme before first paint, so there is no flash of the wrong one */
    try { var t = localStorage.getItem('sc-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript><p style="padding:2rem">SimCore22 needs JavaScript.</p></noscript>
  <script type="module" src="/static/js/player.js"></script>
</body>
</html>
