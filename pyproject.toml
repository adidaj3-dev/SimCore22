# Tool configuration only. SimCore22 is run from source (see README), not installed as a package.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Real problems only (unused/undefined names, syntax errors, likely bugs) - not formatting taste.
select = ["E9", "F", "B"]
